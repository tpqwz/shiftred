name: Build shiftred

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - '0.*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip gcc make

      - name: Download cosmocc (optional, best-effort)
        id: cosmocc
        continue-on-error: true
        run: |
          mkdir -p cosmocc
          cd cosmocc
          # Prefer versioned release; fall back to latest
          curl -L --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            -o cosmocc.zip https://cosmo.zip/pub/cosmocc/cosmocc-4.0.2.zip || \
          curl -L --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            -o cosmocc.zip https://github.com/jart/cosmopolitan/releases/download/4.0.2/cosmocc-4.0.2.zip || \
          curl -L --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            -o cosmocc.zip https://cosmo.zip/pub/cosmocc/cosmocc.zip
          if [ -f cosmocc.zip ]; then
            unzip -q cosmocc.zip || true
            if [ -x bin/cosmocc ]; then
              chmod +x bin/cosmocc
              echo "cosmocc=ok" >> $GITHUB_OUTPUT
              echo "cosmocc downloaded successfully"
            else
              echo "cosmocc binary not found after unzip"
              exit 1
            fi
          else
            echo "cosmocc download failed"
            exit 1
          fi

      - name: Build Actually Portable Executable
        if: steps.cosmocc.outputs.cosmocc == 'ok'
        continue-on-error: true
        run: |
          ./cosmocc/bin/cosmocc -O2 -o shiftred.com shiftred.c
          ls -lh shiftred.com
          file shiftred.com || true
          ./shiftred.com --version || true

      - name: Build static Linux binary
        run: |
          gcc -std=c99 -O2 -static -o shiftred-static shiftred.c -lm
          ls -lh shiftred-static
          file shiftred-static || true
          ./shiftred-static --version || true

      - name: Upload APE binary (artifact)
        if: hashFiles('shiftred.com') != ''
        uses: actions/upload-artifact@v4
        with:
          name: shiftred-ape
          path: shiftred.com

      - name: Upload static binary (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: shiftred-static
          path: shiftred-static

      - name: Create GitHub Release with binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shiftred.com
            shiftred-static
          name: ${{ github.ref_name }}
          body: |
            Automated build of shiftred ${{ github.ref_name }}

            - `shiftred.com` — Actually Portable Executable (cosmocc; runs on Linux/macOS/Windows/FreeBSD/etc.) — present if cosmocc download succeeded
            - `shiftred-static` — static Linux x86_64 binary

            Requires a redshift binary (default `/usr/bin/redshift`, configurable via `~/.config/shiftred` or `REDSHIFT_PATH`).

            Based on the original redshifter script by Tom Wizetek.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
